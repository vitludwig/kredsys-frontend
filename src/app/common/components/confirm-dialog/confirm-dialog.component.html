<h1 mat-dialog-title>{{ data.title }}</h1>
<div mat-dialog-content>{{ data.text }}</div>

<div mat-dialog-actions>
	<button mat-button [mat-dialog-close]="false" data-testid="confirm-no">Ne</button>
	<button mat-button [mat-dialog-close]="true" appAutofocus data-testid="confirm-yes">Ano</button>
</div>
