<div class="place-select-container">
  <mat-card appearance="outlined" class="place-card">
    <mat-card-title class="place-title">Vyber místo</mat-card-title>
    <mat-card-content>
      <mat-form-field>
        <mat-select [(ngModel)]="place"
          placeholder="Místo">
          @for (place of places; track place) {
            <mat-option
              [value]="place"
              [attr.data-testid]="'place-option-' + place.id">
              {{ place.name }}
            </mat-option>
          }
        </mat-select>
      </mat-form-field>
      <div>
        <button color="primary"
          class="w-100"
          mat-raised-button
          [disabled]="!place"
          (click)="selectPlace()"
          >
          Vybrat
        </button>
      </div>
    </mat-card-content>

    @if (errorMsg) {
      <div
        class="alert alert-danger">
        {{ errorMsg }}
      </div>
    }
  </mat-card>
</div>
