<div class="filter-panel">
  <button (click)="clearFilter()"
    color="warn"
    mat-icon-button
    >
    <mat-icon>clear</mat-icon>
  </button>

  @for (type of itemTypes | keyvalue; track type) {
    <button (click)="toggleFilter(type.value.id)"
      [class.active]="(type.value.id | isIncluded: filter)"
      class="filter-btn"
      color="warn"
      mat-stroked-button
      >
      {{ type.value.name}}
    </button>
  }
</div>
