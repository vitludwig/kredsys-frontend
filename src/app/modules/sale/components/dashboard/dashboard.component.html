<div class="dashboard">
  <app-filter-panel [(filter)]="filter"
    [itemTypes]="itemTypes">
  </app-filter-panel>

  <div class="dashboard__grid">
    @for (item of items | filterSaleItems: filter; track item) {
      <mat-card
        appearance="outlined"
        class="dashboard__item mat-elevation-z4"
        mat-ripple
        (click)="addItem(item)"
        [attr.data-testid]="'goods-tile-' + item.id"
        >
        <mat-card-content class="dashboard__content">
          <div class="dashboard__item-body">
            <mat-icon class="dashboard__item-icon">{{ item.icon }}</mat-icon>
            <h3>{{ item.name }}</h3>
          </div>
          <div class="dashboard__item-price">{{ item.price }}<small>Kč</small></div>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
