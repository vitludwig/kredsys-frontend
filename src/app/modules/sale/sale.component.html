<mat-drawer-container class="sale-container">
  <div class="sale-content">
    <div class="sale-content__main">
      <app-dashboard [place]="placeService.selectedPlace"></app-dashboard>
      @if ((customerService.customer$ | async) === null) {
        <div class="disabled-overlay"></div>
      }
    </div>
    <div class="sale-content__sidebar">
      <app-sale-summary [place]="placeService.selectedPlace"></app-sale-summary>
    </div>
  </div>

</mat-drawer-container>
