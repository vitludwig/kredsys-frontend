<div class="login-container">
	<mat-card appearance="outlined" class="login-card">
		<mat-card-title class="login-title">
      Login
      <br>
      <span class="app-logo__tag">Kredsys</span>
    </mat-card-title>
		<mat-card-content>
			<form [formGroup]="loginForm"
				(ngSubmit)="login()"
			>
				<mat-form-field>
					<mat-label>E-mail</mat-label>
					<input type="email"
						required
						matInput
						formControlName="username"
						#userName="matInput"
						data-testid="login-email"
					>
					<mat-error data-testid="login-error">
						<app-error-message [control]="userName.ngControl" [errorMessages]="{email: 'Špatný formát e-mailu'}" />
					</mat-error>
				</mat-form-field>

				<mat-form-field>
					<mat-label>Heslo</mat-label>
					<input type="password"
						required
						matInput
						formControlName="password"
						#password="matInput"
						data-testid="login-password"
					>
					<mat-error>
						<app-error-message [control]="password.ngControl" />
					</mat-error>
				</mat-form-field>

				<div class="mt-3">
					<button type="submit"
						color="primary"
						class="w-100"
						mat-raised-button
						data-testid="login-submit"
					>Přihlásit
					</button>
				</div>
			</form>
		</mat-card-content>
	</mat-card>
</div>


<div (click)="showAdminTools = !showAdminTools"
	[class.opacity-100]="showAdminTools"
	class="admin-tools"
>
	Admin tools

	@if(showAdminTools) {
		<button mat-raised-button
			(click)="emptyLocalStorage()"
		>
			Vymazat localstorage
		</button>
	}
</div>
