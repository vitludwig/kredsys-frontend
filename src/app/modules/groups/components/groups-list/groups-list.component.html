<div class="w-100 d-flex justify-content-between align-items-center">
  <mat-form-field>
    <mat-label>Vyhledávání</mat-label>
    <input matInput
           [formControl]="searchControl">
  </mat-form-field>

  <a mat-button
     [routerLink]="ERoute.NEW"
     color="primary"
  >
    <mat-icon>add</mat-icon>
    Přidat skupinu
  </a>
</div>

<div class="mat-elevation-z4 places-table data-table" data-augmented-ui="tr-2-clip-x br-clip bl-clip-x both">
  <table mat-table [dataSource]="groups()">
    <!-- Name Column -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let group">{{ group.name }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let group">
        <a [routerLink]="[group.id, ERoute.EDIT]"
           mat-raised-button
           color="accent">Upravit</a>

        <button
          mat-raised-button
          (clickConfirm)="removeGroup(group.id)"
          [confirmPreset]="'remove'"
          color="warn"
          class="ms-3"
        >Odstranit</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>
