<div class="uid">
  <div class="uid__row--info">
    <app-user-info-profile [user]="user()" [groups]="groups()" (refresh)="refresh.emit()" />
    <app-user-info-balance
      [user]="user()"
      [currencyAccount]="currencyAccount()"
      [accountLoaded]="accountLoaded()"
      [placeId]="placeId()" [defaultCurrencyId]="defaultCurrencyId()"
      (refresh)="refresh.emit()" />
  </div>

  <hr>

  <app-user-info-transactions
    [user]="user()"
    [transactions]="transactions()"
    [transactionsTotal]="transactionsTotal()"
    [placeId]="placeId()" [accountLoaded]="accountLoaded()"
    (refresh)="refresh.emit()"
    (loadMoreTransactions)="loadMoreTransactions.emit()"
    (filterChange)="filterChange.emit($event)" />

  <hr>

  <div class="row">
    <div class="col-xs-12 col-md-6">
      <app-user-info-cards [user]="user()" [cards]="cards()" (refresh)="refresh.emit()" />
    </div>
    <div class="col-xs-12 col-md-6">
      <app-user-info-statistics [user]="user()" />
    </div>
  </div>

  <div class="uid__footer">
    <button mat-stroked-button (click)="onChangePassword()">Změnit heslo</button>
    @if (user().blocked) {
      <button mat-stroked-button (click)="onToggleBlock()">Odblokovat</button>
    } @else {
      <button mat-stroked-button color="warn" (click)="onToggleBlock()">Zablokovat</button>
    }
  </div>
</div>
