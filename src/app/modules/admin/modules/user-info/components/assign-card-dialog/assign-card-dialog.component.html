<button mat-icon-button style="position:absolute;top:8px;right:8px" mat-dialog-close>
  <mat-icon>close</mat-icon>
</button>

<h2 mat-dialog-title>Přiřadit kartu</h2>

<div mat-dialog-content style="display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:8px">
  <p style="margin:0;text-align:center">Přilož kartu k čtečce — UID se načte automaticky a karta se přiřadí uživateli.</p>

  @if (inProgress) {
    <mat-progress-spinner diameter="32" mode="indeterminate"></mat-progress-spinner>
  } @else {
    <app-card-loader
      [showNewCardButton]="false"
      (cardIdChange)="onCardLoaded($event)"
      data-testid="assign-card-submit">
    </app-card-loader>
  }
</div>
