@if (!isLoading) {
  <div class="row w-100">
    <div class="col-12">
      <h2>Nová transakce</h2>
      <form>
        <mat-form-field
          class="w-100"
          >
          <mat-label>Typ transakce</mat-label>
          <mat-select [(ngModel)]="type"
            required
            name="type"
            appAutofocus
            >
            <mat-option [value]="ETransactionType.PAYMENT">Platba</mat-option>
            <mat-option [value]="ETransactionType.DEPOSIT">Vklad</mat-option>
            <mat-option [value]="ETransactionType.WITHDRAW">Výběr</mat-option>
          </mat-select>
        </mat-form-field>
        <app-input-autocomplete
          label="Uživatel"
          placeholder="Vyhledat podle jména"
          class="w-100"
          [value]="$any(user)"
          (valueChange)="user = $event"
          [dataLoader]="loadUsers"
          primaryDisplayProperty="name"
          secondaryDisplayProperty="memberId"
        ></app-input-autocomplete>
        <app-input-autocomplete
          label="Místo"
          placeholder="Vyhledat podle názvu"
          class="w-100"
          (valueChange)="placeId = $event.id"
          [dataLoader]="loadPlaces"
          primaryDisplayProperty="name"
        ></app-input-autocomplete>
        @if (type) {
          <div
            class="records mb-5">
            <h2>Položky transakce</h2>
            @for (record of records; track record) {
              <div>
                <div class="d-flex justify-content-between align-items-center">
                  @if (type === ETransactionType.PAYMENT) {
                    <app-input-autocomplete
                      label="Zboží"
                      placeholder="Vyhledat podle názvu"
                      class="w-100"
                      (valueChange)="record.goodsId = $event.id"
                      [dataLoader]="loadGoods"
                      primaryDisplayProperty="name"
                    ></app-input-autocomplete>
                    <mat-form-field class="ms-3">
                      <mat-label>Počet</mat-label>
                      <input matInput
                        placeholder="Počet"
                        name="amount"
                        type="number"
                        required
                        [(ngModel)]="record.multiplier"
                        >
                    </mat-form-field>
                  }
                  @if (type === ETransactionType.DEPOSIT || type === ETransactionType.WITHDRAW) {
                    <mat-form-field class="ms-3">
                      <mat-label>Částka</mat-label>
                      <input matInput
                        placeholder="Počet"
                        name="amount"
                        required
                        type="number"
                        [(ngModel)]="record.amount"
                        >
                      <span matSuffix>Kč</span>
                    </mat-form-field>
                  }
                  <button (click)="removeRecord(record)"
                    class="ms-3"
                    color="warn"
                    mat-icon-button
                    >
                    <mat-icon>delete</mat-icon>
                  </button>
                </div>
              </div>
            }
            <button mat-raised-button
              color="primary"
              type="button"
              (click)="addRecord()"
              >
              Přidat záznam
            </button>
          </div>
        }
        <button mat-raised-button
          class="w-100"
          color="primary"
          (click)="submit()"
          >
          Potvrdit
        </button>
      </form>
    </div>
  </div>
}
