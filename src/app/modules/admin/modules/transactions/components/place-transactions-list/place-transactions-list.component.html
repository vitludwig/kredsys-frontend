<mat-form-field>
  <mat-select [(ngModel)]="selectedPlace"
    appAutofocus
    placeholder="Místo"
    >
    @for (place of places; track place) {
      <mat-option
        [value]="place">
        {{ place.name }}
      </mat-option>
    }
  </mat-select>
</mat-form-field>

@if (selectedPlace) {
  <app-transactions-list
	[filterBy]="{
		placeId: selectedPlace.id
	}"
	[showCashFlow]="true"
  ></app-transactions-list>
}
