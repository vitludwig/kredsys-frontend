<button mat-icon-button
  class="close-btn"
  mat-dialog-close=""
  >
  <mat-icon class="close-icon">close</mat-icon>
</button>

<h2 mat-dialog-title>Přidat kartu</h2>

<div mat-dialog-content>
  <form #cardForm="ngForm"
    (ngSubmit)="cardForm.valid && onSubmit()">

    @if (!data.uid) {
      <div class="mt-3"
        >
        <app-card-loader [requireUnassigned]="true" (cardIdChange)="setCardId($event)"></app-card-loader>
      </div>
    }

    @if (data.uid) {
      <mat-form-field
        class="w-100"
        >
        <input matInput
          required
          disabled
          name="id"
          [ngModel]="data.uid"
          >
      </mat-form-field>
    }

    @if (data.uid) {
      <mat-form-field
        class="w-100"
        >
        <mat-label>Popis</mat-label>
        <input matInput
          placeholder="Popis"
          name="description"
          [(ngModel)]="data.description"
          >
      </mat-form-field>
    }

    <button mat-raised-button
      color="primary"
      class="submit-btn"
      type="submit"
      >
      Přidat
    </button>
  </form>
</div>
