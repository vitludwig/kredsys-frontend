<button mat-icon-button
	class="close-btn"
	mat-dialog-close
>
	<mat-icon class="close-icon">close</mat-icon>
</button>

<h2 mat-dialog-title>Přidat položku</h2>

<div mat-dialog-content>
	<mat-form-field
		class="w-100">
		<mat-label>Vyber zboží</mat-label>
    <mat-select [formControl]="selectedOptions" multiple>
      <mat-option>
        <ngx-mat-select-search [noEntriesFoundLabel]="'Žádné výsledky'" [placeholderLabel]="'Vyhledat'" [formControl]="selectedOptionsFilter" />
      </mat-option>
      @for (item of filteredGoods | async; track $index) {
        <mat-option [value]="item">
          <div class="d-flex justify-content-between">
            <span>{{item.name}}</span>
            <span>{{item.price}},-</span>
          </div>
        </mat-option>
      }
    </mat-select>
	</mat-form-field>

	<button mat-raised-button
		color="primary"
		class="submit-btn"
		mat-dialog-close
		(click)="onSubmit()"
	>
		Potvrdit
	</button>
</div>
